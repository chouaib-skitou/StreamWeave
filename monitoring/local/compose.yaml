services:
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../monitoring/local/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - streamweave-local-tempo-data:/var/tempo
    ports: ['3200:3200']
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:3200/ready], interval: 10s, timeout: 3s, retries: 5 }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [../../monitoring/local/otel-config.yaml:/etc/otelcol/config.yaml:ro]
    ports: ['4317:4317', '4318:4318']

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager, --cluster.listen-address=0.0.0.0:9094, --cluster.advertise-address=127.0.0.1:9094]
    volumes:
      - ../../monitoring/local/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - streamweave-local-alertmanager-data:/alertmanager
    ports: ['9093:9093']
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:9093/-/ready], interval: 10s, timeout: 3s, retries: 5 }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --web.enable-lifecycle]
    volumes:
      - ../../monitoring/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/local/prometheus/rules.yml:/etc/prometheus/rules/streamweave.yml:ro
      - streamweave-local-prometheus-data:/prometheus
    ports: ['9090:9090']
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:9090/-/ready], interval: 10s, timeout: 3s, retries: 5 }

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${IDENTITY_GRAFANA_ADMIN_USER:?set IDENTITY_GRAFANA_ADMIN_USER in monitoring/local/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${IDENTITY_GRAFANA_ADMIN_PASSWORD:?set IDENTITY_GRAFANA_ADMIN_PASSWORD in monitoring/local/.env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - streamweave-local-grafana-data:/var/lib/grafana
      - ../../monitoring/local/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../monitoring/local/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../monitoring/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:3000/api/health], interval: 10s, timeout: 3s, retries: 10 }

volumes:
  streamweave-local-tempo-data:
  streamweave-local-prometheus-data:
  streamweave-local-alertmanager-data:
  streamweave-local-grafana-data:
