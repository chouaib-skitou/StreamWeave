openapi: 3.1.0
info:
  title: StreamWeave Orders API
  version: 0.1.0
  description: |
    Internal Orders contract for the StreamWeave Gateway. Orders owns the order
    aggregate, durable idempotency, Inbox/Outbox, and the asynchronous Saga.
    Gateway is the only public edge; direct public access to this service is forbidden.
servers:
  - url: http://localhost:8082
    description: Local development
tags:
  - name: Operations
  - name: Orders
paths:
  /v1/docs:
    get:
      tags: [Operations]
      operationId: ordersSwaggerDocs
      security: []
      responses:
        '200': { description: Swagger UI HTML }
  /v1/openapi.yaml:
    get:
      tags: [Operations]
      operationId: ordersOpenapiContract
      security: []
      responses:
        '200': { description: OpenAPI contract YAML }
  /health/live:
    get:
      tags: [Operations]
      operationId: ordersHealthLive
      security: []
      responses:
        '200':
          description: Process is alive
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
  /health/ready:
    get:
      tags: [Operations]
      operationId: ordersHealthReady
      security: []
      responses:
        '200':
          description: Required dependencies and consumers are ready
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /metrics:
    get:
      tags: [Operations]
      operationId: ordersMetrics
      x-internal: true
      security: []
      responses:
        '200': { description: Prometheus exposition format }
  /v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      security: [{ gatewayServiceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } }
      responses:
        '202':
          description: Order committed locally and queued for asynchronous processing
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderAccepted' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Orders]
      operationId: listOrders
      security: [{ gatewayServiceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/OrderStatus'
      responses:
        '200':
          description: Authorized cursor-paginated order list
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/orders/{order_id}:
    get:
      tags: [Orders]
      operationId: getOrder
      security: [{ gatewayServiceAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Authorized order
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/orders/{order_id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      security: [{ gatewayServiceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelOrderRequest' } } }
      responses:
        '202':
          description: Cancellation committed and queued for asynchronous processing
          content: { application/json: { schema: { $ref: '#/components/schemas/CancellationAccepted' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    gatewayServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Identity-issued Gateway service token; human tokens are not accepted directly.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    CustomerId:
      name: customer_id
      in: query
      description: Operator-only target filter. Customer requests are bound to the trusted actor.
      schema: { type: string, pattern: '^usr_[A-Za-z0-9]+$' }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    OrderStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/OrderStatus' }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: Missing or invalid Gateway service authentication
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Actor is not authorized for this operation or resource
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Resource is not visible to this actor
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Idempotency or state conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UnprocessableEntity:
      description: Domain validation failed
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ServiceUnavailable:
      description: Required dependency unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_id, items, currency]
      additionalProperties: false
      properties:
        customer_id: { type: string, pattern: '^usr_[A-Za-z0-9]+$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderItemRequest' }
    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id: { type: string, pattern: '^prd_[A-Za-z0-9]+$' }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    CancelOrderRequest:
      type: object
      additionalProperties: false
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$', default: CUSTOMER_REQUESTED, description: Stable cancellation reason; Orders uses CUSTOMER_REQUESTED when the body is omitted. }
    OrderAccepted:
      type: object
      required: [order_id, status, created_at]
      additionalProperties: false
      properties:
        order_id: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
        status: { type: string, const: PENDING }
        created_at: { type: string, format: date-time }
    CancellationAccepted:
      type: object
      required: [order_id, status, created_at]
      additionalProperties: false
      properties:
        order_id: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
        status: { type: string, const: CANCEL_REQUESTED }
        created_at: { type: string, format: date-time }
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCEL_REQUESTED, CANCELLED, COMPLETED, FAILED]
    Order:
      type: object
      required: [order_id, customer_id, status, currency, total_minor, items, created_at, updated_at]
      additionalProperties: false
      properties:
        order_id: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
        customer_id: { type: string, pattern: '^usr_[A-Za-z0-9]+$' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        total_minor: { type: [integer, 'null'], minimum: 0, maximum: 1000000000 }
        failure_code: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItem' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [product_id, quantity, unit_price_minor, line_total_minor]
      additionalProperties: false
      properties:
        product_id: { type: string, pattern: '^prd_[A-Za-z0-9]+$' }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        unit_price_minor: { type: [integer, 'null'], minimum: 0, maximum: 1000000000 }
        line_total_minor: { type: [integer, 'null'], minimum: 0, maximum: 1000000000 }
        quote_id: { type: [string, 'null'], pattern: '^qte_[A-Za-z0-9]+$' }
        quote_version: { type: [integer, 'null'], minimum: 1 }
    OrderPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        next_cursor: { type: [string, 'null'], maxLength: 256 }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
        dependencies: { type: object, additionalProperties: { type: string, enum: [ok, unavailable] } }
    ProblemDetails:
      type: object
      required: [type, title, status, detail, request_id]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        request_id: { type: string }
