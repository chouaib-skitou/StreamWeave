openapi: 3.1.0
info:
  title: StreamWeave Gateway API
  version: 0.1.0
  description: |
    Public HTTP facade for StreamWeave. The Gateway owns edge concerns only:
    request identity, tracing, coarse authentication policy, rate limiting,
    routing, and standardized errors. Identity and Orders remain authoritative
    for their own resources and business authorization.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Operations
  - name: Authentication
  - name: Orders
paths:
  /v1/docs:
    get:
      tags: [Operations]
      operationId: gatewaySwaggerDocs
      security: []
      responses:
        '200': { description: Swagger UI HTML }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/openapi.yaml:
    get:
      tags: [Operations]
      operationId: gatewayOpenapiContract
      security: []
      responses:
        '200': { description: OpenAPI contract YAML }
  /health/live:
    get:
      tags: [Operations]
      operationId: gatewayHealthLive
      security: []
      responses:
        '200':
          description: Gateway process is alive
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
  /health/ready:
    get:
      tags: [Operations]
      operationId: gatewayHealthReady
      security: []
      responses:
        '200':
          description: Gateway can safely accept traffic under its configured policy
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /metrics:
    get:
      tags: [Operations]
      operationId: gatewayMetrics
      description: Internal monitoring surface; must not be internet-public.
      x-internal: true
      security: []
      responses:
        '200': { description: Prometheus exposition format }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: gatewayLogin
      description: Routed to Identity. Anonymous but aggressively rate limited.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: Authenticated session
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: gatewayRefreshSession
      description: Routed to Identity. Refresh-token rotation remains Identity-owned.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } }
      responses:
        '200':
          description: Rotated authenticated session
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: gatewayLogout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: gatewayLogoutAll
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: gatewayListSessions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Current user's sessions
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: gatewayRequestPasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '202': { description: Reset request accepted without account enumeration }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: gatewayConfirmPasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } } }
      responses:
        '204': { description: Password reset completed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/email-verification/confirm:
    post:
      tags: [Authentication]
      operationId: gatewayConfirmEmailVerification
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } }
      responses:
        '204': { description: Email address verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/orders:
    post:
      tags: [Orders]
      operationId: gatewayCreateOrder
      description: Routed to Orders. Creation is asynchronous and returns 202. Orders owns idempotency and business validation.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } }
      responses:
        '202':
          description: Order accepted for asynchronous processing
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderAccepted' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    get:
      tags: [Orders]
      operationId: gatewayListOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customer_id
          in: query
          description: Operator-only filter; customer requests are constrained by Orders ownership policy.
          schema: { type: string, pattern: '^cus_[A-Za-z0-9]+$' }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Cursor-paginated orders
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/orders/{order_id}:
    get:
      tags: [Orders]
      operationId: gatewayGetOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order view after owner authorization
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/orders/{order_id}/cancel:
    post:
      tags: [Orders]
      operationId: gatewayCancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation accepted for asynchronous processing
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderAccepted' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: Authentication failed
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Authenticated but not permitted
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Resource state or idempotency conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Resource not found
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds before retrying
          schema: { type: integer, minimum: 1 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ServiceUnavailable:
      description: Required dependency unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    GatewayTimeout:
      description: Upstream deadline exceeded
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 32, writeOnly: true }
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, writeOnly: true }
        new_password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 32, writeOnly: true }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      additionalProperties: false
      properties:
        access_token: { type: string, readOnly: true }
        refresh_token: { type: string, readOnly: true }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 600, minimum: 1 }
        refresh_expires_in: { type: integer, minimum: 1 }
    Session:
      type: object
      required: [id, family_id, status, created_at, expires_at]
      properties:
        id: { type: string }
        family_id: { type: string }
        status: { type: string, enum: [ACTIVE, ROTATED, REVOKED] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    SessionPage:
      type: object
      required: [sessions, next_cursor]
      properties:
        sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { type: [string, 'null'] }
    CreateOrderRequest:
      type: object
      required: [customer_id, items, currency]
      additionalProperties: false
      properties:
        customer_id: { type: string, pattern: '^cus_[A-Za-z0-9]+$' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemRequest' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id: { type: string, pattern: '^prd_[A-Za-z0-9]+$' }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    OrderAccepted:
      type: object
      required: [order_id, status, created_at]
      properties:
        order_id: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
        status: { type: string, enum: [PENDING, ACCEPTED] }
        created_at: { type: string, format: date-time }
    Order:
      type: object
      required: [order_id, customer_id, status, currency, items, created_at]
      properties:
        order_id: { type: string, pattern: '^ord_[A-Za-z0-9]+$' }
        customer_id: { type: string, pattern: '^cus_[A-Za-z0-9]+$' }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCEL_REQUESTED, CANCELLED, COMPLETED, FAILED] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    OrderItem:
      type: object
      required: [product_id, quantity, unit_price_minor]
      properties:
        product_id: { type: string, pattern: '^prd_[A-Za-z0-9]+$' }
        quantity: { type: integer, minimum: 1 }
        unit_price_minor: { type: integer, minimum: 0 }
    OrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        next_cursor: { type: [string, 'null'] }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
        dependencies:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
    ProblemDetails:
      type: object
      required: [type, title, status, detail, request_id]
      additionalProperties: false
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        request_id: { type: string }
