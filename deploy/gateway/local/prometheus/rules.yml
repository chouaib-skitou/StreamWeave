groups:
  - name: streamweave-gateway
    rules:
      - alert: GatewayDown
        expr: up{job="streamweave-gateway"} == 0
        for: 2m
        labels: { severity: critical, service: gateway }
        annotations:
          summary: StreamWeave Gateway is not scrapeable
          description: Prometheus cannot scrape the Gateway metrics endpoint.
      - alert: GatewayHigh5xxRate
        expr: sum(rate(gateway_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(gateway_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warning, service: gateway }
        annotations:
          summary: Gateway 5xx rate is above 5 percent
          description: The Gateway is returning an elevated rate of server errors.

