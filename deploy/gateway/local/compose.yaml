services:
  gateway-redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, no]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }

  gateway:
    build: { context: ../../.., dockerfile: deploy/gateway/Dockerfile }
    environment:
      GATEWAY_HTTP_ADDR: :8080
      GATEWAY_ENVIRONMENT: development
      GATEWAY_OPENAPI_PATH: /contracts/openapi/gateway.openapi.yaml
      GATEWAY_IDENTITY_URL: http://host.docker.internal:8080
      GATEWAY_JWKS_URL: http://host.docker.internal:8080/.well-known/jwks.json
      GATEWAY_ORDERS_URL: ${GATEWAY_ORDERS_URL:?set GATEWAY_ORDERS_URL in .env}
      GATEWAY_ISSUER: identity.local
      GATEWAY_HUMAN_AUDIENCE: platform-api
      GATEWAY_REDIS_URL: redis://gateway-redis:6379/0
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?set GATEWAY_SERVICE_TOKEN in .env}
      GATEWAY_OTEL_ENDPOINT: ""
      GATEWAY_CORS_ORIGINS: http://localhost:3000
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      gateway-redis: { condition: service_healthy }
    ports: ['8081:8080']
    read_only: true
    user: 'gateway'
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:8080/health/ready], interval: 10s, timeout: 3s, retries: 10 }
