apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
  labels:
{{ include "gateway.labels" . | indent 4 }}
data:
  GATEWAY_IDENTITY_URL: {{ .Values.config.identityURL | quote }}
  GATEWAY_ORDERS_URL: {{ .Values.config.ordersURL | quote }}
  GATEWAY_JWKS_URL: {{ .Values.config.jwksURL | quote }}
  GATEWAY_ISSUER: {{ .Values.config.issuer | quote }}
  GATEWAY_HUMAN_AUDIENCE: {{ .Values.config.humanAudience | quote }}
  GATEWAY_SERVICE_CLIENT_ID: {{ .Values.config.serviceClientID | quote }}
  GATEWAY_SERVICE_SCOPES: {{ .Values.config.serviceScopes | quote }}
  GATEWAY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GATEWAY_METRICS_PATH: {{ .Values.config.metricsPath | quote }}
  GATEWAY_OPENAPI_PATH: {{ .Values.config.openapiPath | quote }}
  GATEWAY_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  GATEWAY_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  GATEWAY_OTEL_INSECURE: {{ .Values.config.otelInsecure | quote }}
