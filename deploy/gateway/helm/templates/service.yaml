apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
{{ include "gateway.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "gateway.labels" . | indent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

