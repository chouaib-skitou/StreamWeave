apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
{{ include "gateway.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
{{ include "gateway.labels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "gateway.labels" . | indent 8 }}
    spec:
      serviceAccountName: {{ include "gateway.fullname" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: {{ include "gateway.fullname" . }}-config }
            - secretRef: { name: {{ include "gateway.secretName" . }} }
          env:
            - name: GATEWAY_HTTP_ADDR
              value: ":8080"
            - name: GATEWAY_ENVIRONMENT
              value: {{ .Values.environment | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe: { httpGet: { path: /health/ready, port: http }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }

