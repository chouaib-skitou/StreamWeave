{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orders.apiServiceAccountName" . }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orders.relayServiceAccountName" . }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
