receivers:
  otlp:
    protocols: { grpc: {}, http: {} }
exporters:
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: identity-tempo:4317
    tls:
      insecure: true
service:
  pipelines:
    traces: { receivers: [otlp], exporters: [otlp/tempo, debug] }
    metrics: { receivers: [otlp], exporters: [debug] }
