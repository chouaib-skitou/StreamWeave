image:
  repository: identity
  tag: local
  pullPolicy: IfNotPresent
service:
  port: 8080
replicaCount: 2
environment: production
terminationGracePeriodSeconds: 30
pdb:
  minAvailable: 1
migration:
  enabled: true
  backoffLimit: 4
config:
  issuer: identity.local
  humanAudience: platform-api
  machineAudience: platform-internal
  logLevel: info
  demoRegistration: false
  databaseURL: postgres://identity@identity-postgres:5432/identity?sslmode=disable
  redisURL: redis://identity-redis:6379/0
  kafkaBrokers: identity-kafka:9092
  signingKeyPath: /var/run/secrets/identity/signing-key.pem
  signingKeyID: identity-v1
  mailerMode: smtp
  testMailerEnabled: false
  smtpHost: ""
  smtpPort: 587
  smtpFrom: identity@example.com
  publicAppURL: https://app.example.com
  otelEndpoint: ""
  otelInsecure: false
  signingKeyHistoryDir: ""
  trustProxyHeaders: true
  rateLoginSource: 30
  rateRefreshSource: 120
  rateResetSource: 12
  rateServiceSource: 120
secret:
  create: true
  existingSecret: ""
  signingKeyHistoryExistingSecret: ""
  databaseURL: ""
  redisURL: ""
  signingKeyPEM: ""
  smtpUsername: ""
  smtpPassword: ""
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 512Mi }
networkPolicy:
  enabled: true
  allowedIngressNamespaceLabels:
    kubernetes.io/metadata.name: ecommerce-gateway
  allowedIngressPodLabels:
    app.kubernetes.io/name: gateway
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  monitoringPodLabels:
    app.kubernetes.io/name: prometheus
  allowSMTP: true
