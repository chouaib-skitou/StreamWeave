apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "identity.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "identity.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "identity.name" . }}
    spec:
      serviceAccountName: {{ include "identity.fullname" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: identity
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: {{ include "identity.fullname" . }}-config }
            - secretRef: { name: {{ .Values.secret.existingSecret | default (printf "%s-secret" (include "identity.fullname" .)) }} }
          env:
            - name: IDENTITY_HTTP_ADDR
              value: ":8080"
            - name: IDENTITY_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: IDENTITY_RUN_MIGRATIONS
              value: "false"
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/secrets/identity
              readOnly: true
{{- if .Values.secret.signingKeyHistoryExistingSecret }}
            - name: signing-key-history
              mountPath: /var/run/secrets/identity/history
              readOnly: true
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe: { httpGet: { path: /health/startup, port: http }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
      volumes:
        - name: signing-key
          secret:
            secretName: {{ .Values.secret.existingSecret | default (printf "%s-secret" (include "identity.fullname" .)) }}
            items:
              - key: signing-key.pem
                path: signing-key.pem
{{- if .Values.secret.signingKeyHistoryExistingSecret }}
        - name: signing-key-history
          secret:
            secretName: {{ .Values.secret.signingKeyHistoryExistingSecret }}
{{- end }}
