{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "identity.fullname" . }}-secret
type: Opaque
stringData:
  IDENTITY_DATABASE_URL: {{ required "secret.databaseURL is required when secret.create is true" .Values.secret.databaseURL | quote }}
  IDENTITY_REDIS_URL: {{ required "secret.redisURL is required when secret.create is true" .Values.secret.redisURL | quote }}
  IDENTITY_SMTP_USERNAME: {{ .Values.secret.smtpUsername | quote }}
  IDENTITY_SMTP_PASSWORD: {{ .Values.secret.smtpPassword | quote }}
  signing-key.pem: {{ .Values.secret.signingKeyPEM | quote }}
{{- end }}
