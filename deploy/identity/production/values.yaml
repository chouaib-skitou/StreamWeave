environment: production
replicaCount: 2
secret:
  create: false
  existingSecret: identity-external
  signingKeyHistoryExistingSecret: identity-signing-key-history
config:
  mailerMode: smtp
  testMailerEnabled: false
  smtpHost: live.smtp.mailtrap.io
  smtpPort: 587
  smtpFrom: identity@example.com
  publicAppURL: https://app.example.com
  otelEndpoint: otel-collector.monitoring.svc.cluster.local:4317
  signingKeyHistoryDir: /var/run/secrets/identity/history
  trustProxyHeaders: true
networkPolicy:
  allowedIngressNamespaceLabels:
    kubernetes.io/metadata.name: ecommerce-gateway
  allowedIngressPodLabels:
    app.kubernetes.io/name: gateway
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  monitoringPodLabels:
    app.kubernetes.io/name: prometheus
  allowSMTP: true
