services:
  identity-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in monitoring/local/.env}
    volumes: [streamweave-local-postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U identity -d identity'], interval: 5s, timeout: 5s, retries: 10 }

  identity-redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, no]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }

  identity-kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://identity-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@identity-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 12

  identity-kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      identity-kafka: { condition: service_healthy }
    command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, identity-kafka:9092, --create, --if-not-exists, --topic, commerce.security.audit.v1, --partitions, '1', --replication-factor, '1']

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['8025:8025', '1025:1025']
    expose: ['1025']

  identity:
    build: { context: ../.., dockerfile: deploy/identity/Dockerfile }
    environment:
      IDENTITY_HTTP_ADDR: :8080
      IDENTITY_OPENAPI_PATH: /contracts/openapi/identity.openapi.yaml
      IDENTITY_ENVIRONMENT: development
      IDENTITY_DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in monitoring/local/.env}@identity-postgres:5432/identity?sslmode=disable
      IDENTITY_REDIS_URL: redis://identity-redis:6379/0
      IDENTITY_KAFKA_BROKERS: identity-kafka:9092
      IDENTITY_DEMO_REGISTRATION_ENABLED: 'true'
      IDENTITY_RUN_MIGRATIONS: 'true'
      IDENTITY_LOG_LEVEL: info
      IDENTITY_MAILER_MODE: smtp
      IDENTITY_TEST_MAILER_ENABLED: 'false'
      IDENTITY_SMTP_HOST: mailhog
      IDENTITY_SMTP_PORT: '1025'
      IDENTITY_SMTP_FROM: identity@local.test
      IDENTITY_PUBLIC_APP_URL: http://localhost:3000
      IDENTITY_OTEL_ENDPOINT: otel-collector:4317
      IDENTITY_OTEL_INSECURE: 'true'
    depends_on:
      identity-postgres: { condition: service_healthy }
      identity-redis: { condition: service_healthy }
      identity-kafka-init: { condition: service_completed_successfully }
      mailhog: { condition: service_started }
    ports: ['8080:8080']
    read_only: true
    user: 'identity'
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:8080/health/ready], interval: 10s, timeout: 3s, retries: 10 }

  gateway-redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, no]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }

  gateway:
    build: { context: ../.., dockerfile: deploy/gateway/Dockerfile }
    environment:
      GATEWAY_HTTP_ADDR: :8080
      GATEWAY_ENVIRONMENT: development
      GATEWAY_OPENAPI_PATH: /contracts/openapi/gateway.openapi.yaml
      GATEWAY_IDENTITY_URL: http://identity:8080
      GATEWAY_JWKS_URL: http://identity:8080/.well-known/jwks.json
      GATEWAY_ORDERS_URL: ${GATEWAY_ORDERS_URL:-http://host.docker.internal:8082}
      GATEWAY_ISSUER: identity.local
      GATEWAY_HUMAN_AUDIENCE: platform-api
      GATEWAY_REDIS_URL: redis://gateway-redis:6379/0
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?set GATEWAY_SERVICE_TOKEN in monitoring/local/.env}
      GATEWAY_OTEL_ENDPOINT: otel-collector:4317
      GATEWAY_OTEL_INSECURE: 'true'
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      identity: { condition: service_healthy }
      gateway-redis: { condition: service_healthy }
    ports: ['8081:8080']
    read_only: true
    user: 'gateway'
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:8080/health/ready], interval: 10s, timeout: 3s, retries: 10 }

  orders-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in monitoring/local/.env}
    volumes: [streamweave-local-orders-postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U orders -d orders'], interval: 5s, timeout: 5s, retries: 10 }

  orders:
    build: { context: ../.., dockerfile: deploy/orders/Dockerfile }
    environment:
      ORDERS_HTTP_ADDR: :8080
      ORDERS_OPENAPI_PATH: /contracts/openapi/orders.openapi.yaml
      ORDERS_ENVIRONMENT: development
      ORDERS_DATABASE_URL: postgres://orders:${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in monitoring/local/.env}@orders-postgres:5432/orders?sslmode=disable
      ORDERS_KAFKA_BROKERS: identity-kafka:9092
      ORDERS_OTEL_ENDPOINT: otel-collector:4317
      ORDERS_OTEL_INSECURE: 'true'
      ORDERS_LOG_LEVEL: info
    depends_on:
      orders-postgres: { condition: service_healthy }
      identity-kafka-init: { condition: service_completed_successfully }
    ports: ['8082:8080']
    read_only: true
    user: 'orders'
    healthcheck: { test: [CMD, wget, --spider, -q, http://localhost:8080/health/ready], interval: 10s, timeout: 3s, retries: 10 }

volumes:
  streamweave-local-postgres-data:
  streamweave-local-orders-postgres-data:
