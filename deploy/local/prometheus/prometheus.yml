global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: [identity:8080]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
