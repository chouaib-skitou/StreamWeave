name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release and synchronize dev
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Publish release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before_sha="$(git rev-parse HEAD)"
          npm run release
          after_sha="$(git rev-parse HEAD)"

          if [[ "$before_sha" == "$after_sha" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(tr -d '\r\n' < VERSION)"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Synchronize release files to dev
        if: steps.release.outputs.created == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main dev --tags
          sync_dir="${RUNNER_TEMP}/dev-release-sync"
          git worktree add --detach "$sync_dir" origin/dev
          git -C "$sync_dir" checkout origin/main -- VERSION CHANGELOG.md

          if git -C "$sync_dir" diff --quiet -- VERSION CHANGELOG.md; then
            echo "dev already contains release metadata ${RELEASE_VERSION}."
            exit 0
          fi

          git -C "$sync_dir" config user.name "github-actions[bot]"
          git -C "$sync_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$sync_dir" add VERSION CHANGELOG.md
          git -C "$sync_dir" commit -m "chore(release): Sync version ${RELEASE_VERSION} to dev [skip ci]"
          git -C "$sync_dir" push origin HEAD:dev
