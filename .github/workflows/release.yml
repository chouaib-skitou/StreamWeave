name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Check out released main
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read released version
        id: version
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION does not contain a valid SemVer value: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create dev synchronization pull request
        if: steps.release.outputs.release_created == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: automation/release-sync-v${{ steps.version.outputs.value }}
          delete-branch: true
          commit-message: "chore(release): Sync version ${{ steps.version.outputs.value }} to dev"
          title: "chore(release): Sync version ${{ steps.version.outputs.value }} to dev"
          body: |
            ## Summary

            Synchronize the released platform version from `main` to `dev`.

            This pull request is generated after GitHub Release `v${{ steps.version.outputs.value }}` is published.

            ## Validation

            - [ ] Confirm `VERSION` matches the published release.
            - [ ] Confirm `CHANGELOG.md` contains the published release entry.
            - [ ] Confirm no development-only changes are overwritten.

            The `dev` branch remains protected and must be updated through this reviewed pull request.
