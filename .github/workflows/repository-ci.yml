name: Repository CI

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/**'
      - 'monitoring/**'
      - 'deploy/local/**'
      - '.github/workflows/**'
      - '.github/workflows/repository-ci.yml'

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repository tests
        run: go test ./... -race
      - name: Run repository vet
        run: go vet ./...
