name: Repository CI

on:
  pull_request:
    paths:
      - 'Makefile'
      - '.github/workflows/repository-ci.yml'

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repository tests
        run: go test ./... -race
      - name: Run repository vet
        run: go vet ./...

