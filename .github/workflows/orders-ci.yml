name: Orders CI

on:
  pull_request:
    paths:
      - 'apps/orders/**'
      - 'database/orders/**'
      - 'contracts/openapi/orders.openapi.yaml'
      - 'contracts/events/**'
      - 'deploy/orders/**'
      - 'deploy/local/compose.yaml'
      - 'monitoring/local/**'
      - 'Makefile'
      - '.github/workflows/orders-ci.yml'

permissions:
  contents: read

concurrency:
  group: orders-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Orders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests and coverage
        run: |
          go test ./apps/orders/... -race
          go test ./apps/orders/internal/application/health -coverprofile=orders-coverage.out
      - name: Enforce Orders coverage gate
        shell: bash
        run: |
          coverage="$(go tool cover -func=orders-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85.0) exit 1 }'
          echo "Orders application coverage: ${coverage}%"
      - name: Run vet and formatting checks
        shell: bash
        run: |
          go vet ./apps/orders/...
          test -z "$(gofmt -l apps/orders)"
      - name: Validate local Compose
        run: docker compose --env-file monitoring/local/.env.example -f deploy/local/compose.yaml -f monitoring/local/compose.yaml config --quiet
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Validate Orders migration syntax
        run: test -s database/orders/migrations/00001_orders_foundation.sql
      - name: Build service
        run: go build -trimpath -o /tmp/orders ./apps/orders/cmd/api
      - name: Build container image
        run: docker build --file deploy/orders/Dockerfile --tag streamweave-orders:ci .
