name: Identity CI

on:
  pull_request:
    paths:
      - 'apps/identity/**'
      - 'database/identity/**'
      - 'contracts/**'
      - 'deploy/identity/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'sqlc.yaml'
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated database adapter
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0 generate && git diff --exit-code -- apps/identity/internal/adapters/outbound/postgres/generated
      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out
      - name: Enforce Identity coverage gate
        shell: bash
        run: |
          go test ./apps/identity/internal/application/identity -coverprofile=identity-coverage.out
          coverage="$(go tool cover -func=identity-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85.0) { exit 1 } }'
          echo "Identity application coverage: ${coverage}%"
      - name: Run vet
        run: go vet ./...
      - name: Run security tests
        run: go test -tags=security ./apps/identity/tests/security/...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l apps/identity)"
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate Kubernetes chart
        run: |
          helm lint deploy/identity/helm -f deploy/identity/staging/values.yaml
          helm lint deploy/identity/helm -f deploy/identity/production/values.yaml
      - name: Validate local Compose profile
        run: docker compose --env-file deploy/identity/local/.env.example -f deploy/identity/local/compose.yaml config
      - name: Build service
        run: go build -trimpath -o /tmp/identity ./apps/identity/cmd/api

  integration-smoke:
    name: Run Identity integration smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local Identity stack
        shell: bash
        run: |
          cp deploy/identity/local/.env.example deploy/identity/local/.env
          docker compose --env-file deploy/identity/local/.env -f deploy/identity/local/compose.yaml up -d --build
      - name: Wait for Identity readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file deploy/identity/local/.env -f deploy/identity/local/compose.yaml ps
          exit 1
      - name: Exercise Identity flow
        shell: pwsh
        run: ./scripts/identity-smoke.ps1
      - name: Collect service logs on failure
        if: failure()
        shell: bash
        run: docker compose --env-file deploy/identity/local/.env -f deploy/identity/local/compose.yaml logs --no-color identity identity-mailhog
      - name: Stop local Identity stack
        if: always()
        shell: bash
        run: docker compose --env-file deploy/identity/local/.env -f deploy/identity/local/compose.yaml down -v

  publish-image:
    name: Publish Identity image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read platform version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a valid semantic version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/identity
          tags: |
            type=raw,value=main
            type=sha,format=short
            type=raw,value={{branch}}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=v${{ steps.version.outputs.value }}

      - name: Build and push Identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/identity/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
