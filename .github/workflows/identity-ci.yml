name: Identity CI

on:
  pull_request:
    paths:
      - 'apps/identity/**'
      - 'database/identity/**'
      - 'contracts/openapi/identity.openapi.yaml'
      - 'deploy/identity/**'
      - '.github/workflows/identity-ci.yml'
      - 'scripts/**'
      - 'sqlc.yaml'
permissions:
  contents: read

jobs:
  verify:
    name: Verify Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated database adapter
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0 generate && git diff --exit-code -- apps/identity/internal/adapters/outbound/postgres/generated
      - name: Run tests
        run: go test ./... -race -coverprofile coverage.out
      - name: Enforce Identity coverage gate
        shell: bash
        run: |
          go test ./apps/identity/internal/application/identity -coverprofile identity-coverage.out
          coverage="$(go tool cover -func=identity-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85.0) { exit 1 } }'
          echo "Identity application coverage: ${coverage}%"
      - name: Run vet
        run: go vet ./...
      - name: Run security tests
        run: go test -tags=security ./apps/identity/tests/security/...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l apps/identity)"
      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Validate Kubernetes chart
        run: |
          helm lint deploy/identity/helm -f deploy/identity/staging/values.yaml
          helm lint deploy/identity/helm -f deploy/identity/production/values.yaml
      - name: Validate local Compose profile
        run: docker compose --env-file monitoring/local/.env.example -f deploy/local/compose.yaml -f monitoring/local/compose.yaml config --quiet
      - name: Build service
        run: go build -trimpath -o /tmp/identity ./apps/identity/cmd/api

  integration-smoke:
    name: Run Identity integration smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start local Identity stack
        shell: bash
        run: |
          cp monitoring/local/.env.example monitoring/local/.env
          docker compose --env-file monitoring/local/.env -f deploy/local/compose.yaml -f monitoring/local/compose.yaml up -d --build identity
      - name: Wait for Identity readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file monitoring/local/.env -f deploy/local/compose.yaml -f monitoring/local/compose.yaml ps
          exit 1
      - name: Exercise Identity flow
        shell: pwsh
        run: ./scripts/identity-smoke.ps1
      - name: Collect service logs on failure
        if: failure()
        shell: bash
        run: docker compose --env-file monitoring/local/.env -f deploy/local/compose.yaml -f monitoring/local/compose.yaml logs --no-color identity mailhog
      - name: Stop local Identity stack
        if: always()
        shell: bash
        run: docker compose --env-file monitoring/local/.env -f deploy/local/compose.yaml -f monitoring/local/compose.yaml down -v
